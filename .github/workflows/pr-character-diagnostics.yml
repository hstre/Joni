name: character-diagnostics

on:
  push:
    branches:
      - feature/muendigkeit-behavior-gate

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Capture targeted tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/character/test_behavior_gate.py \
            tests/constitution/test_gate.py \
            tests/test_guard.py \
            tests/test_character.py > character-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> character-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: character-diagnostics
          path: character-diagnostics.txt
          if-no-files-found: error
